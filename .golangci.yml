version: 2
linters:
  default: standard
  enable:
    - bodyclose
    - misspell
    - nilnil
    - sloglint
    - depguard
    - iface
    - unparam
    - forbidigo

linters-settings:
  sloglint:
    no-mixed-args: true
    kv-only: true
    no-global: all
    context: all
    static-msg: true
    msg-style: lowercased
    key-naming-case: snake
  depguard:
    rules:
      nozap:
        deny:
          - pkg: "go.uber.org/zap"
            desc: "Do not use zap logger. Use slog instead."
      noerrors:
        deny:
          - pkg: "errors"
            desc: "Do not use the standard errors package. Use github.com/SigNoz/signoz/pkg/errors instead."
  iface:
    enable:
      - identical
  forbidigo:
    forbid:
      - pattern: ^fmt\.Errorf$
        msg: "Use github.com/SigNoz/signoz/pkg/errors (Errorf/Wrap/Wrapf) instead of fmt.Errorf."

issues:
  exclude-dirs:
    - "pkg/query-service"
    - "ee/query-service"
    - "scripts/"
